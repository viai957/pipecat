name: Build Native Wheels

on:
  push:
    tags:
      - 'native-v*'
    # No paths filter on tag push — releases must always trigger
  pull_request:
    paths:
      - 'pipecat-rs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Clippy + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipecat-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipecat-rs

      - name: Clippy (all crates except pipecat-python)
        run: cargo clippy --workspace --exclude pipecat-python -- -D warnings

      - name: Rust tests (all crates except pipecat-python)
        run: cargo test --workspace --exclude pipecat-python

      - name: Check pipecat-python compiles
        run: cargo check -p pipecat-python

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: pipecat-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipecat-rs

      - name: Run Criterion benchmarks
        run: cargo bench -p pipecat-bench --no-fail-fast 2>&1 | tee bench-output.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: pipecat-rs/bench-output.txt

  build:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-13
            target: x86_64
          - os: macos-14
            target: aarch64
          - os: windows-latest
            target: x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pipecat-rs

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto
          working-directory: pipecat-rs/crates/pipecat-python

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: pipecat-rs/crates/pipecat-python/dist

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          working-directory: pipecat-rs/crates/pipecat-python

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: pipecat-rs/crates/pipecat-python/dist

  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [build, sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/pipecat-ai-native
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
